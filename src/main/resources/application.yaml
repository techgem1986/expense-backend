server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  # Flyway owns the database schema. Migrations under classpath:db/migration are
  # applied automatically on application startup.
  # baseline-on-migrate lets Flyway adopt a pre-existing database (created by the
  # old docker-entrypoint-initdb.d / Hibernate ddl-auto setup) without failing.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    secret: ${APP_JWT_SECRET:your-secret-key-for-development-only-change-this-in-production}
    expiration: 86400
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://expense-frontend-xhyh.onrender.com}
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true
